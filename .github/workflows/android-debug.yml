name: Android Debug APK

# 只产调试版 APK：用 Gradle 自动生成的 debug 签名，仓库内不含任何真实签名密钥。
# 与 release.yml 解耦：tag 发布不会触发本工作流，本工作流也不创建 Release。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile-shell/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装依赖
        run: npm ci

      - name: 同步壳页面与插件到 Android 工程
        run: npx cap sync android

      - name: 构建 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: flamevision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
